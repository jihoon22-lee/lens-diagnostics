name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test Workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format Check
        run: cargo fmt --all -- --check
      - name: Clippy Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run All Workspace Tests
        run: cargo test --workspace --verbose
      - name: Install Python Check Dependencies
        run: pip install jsonschema pyyaml
      - name: Check Documentation Consistency
        run: python3 .github/scripts/check_docs.py
      - name: Test Release Flow Scripts
        run: |
          python3 .github/scripts/test_release_flow.py
          python3 .github/scripts/test_install.py

  build-release:
    name: Build Release Binaries
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build Release
        run: cargo build --release --workspace
      - name: Test Release Binary Execution
        run: |
          ./target/release/lens --version
          ./target/release/lens --help
          ./target/release/lens-tui --help

  merge-gate:
    name: Merge Gate
    runs-on: ubuntu-latest
    needs: [test, build-release]
    steps:
      - name: Gate Check
        run: echo "All workspace tests and release builds passed. Merge Gate open."

