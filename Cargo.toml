[workspace]
members = [
    "crates/lens-core",
    "crates/lens-disk",
    "crates/lens-abi",
    "crates/lens-log",
    "crates/lens-test",
    "crates/lens-trace",
    "crates/lens-sys",
    "crates/lens-build",
    "crates/lens-env",
    "crates/lens-cli",
    "crates/lens-tui",
    "crates/lens-mcp",
    "crates/lens-net",
    "crates/lens-ops",
]
resolver = "2"

[workspace.package]
version = "0.8.0"
edition = "2021"
authors = ["Jihoon Lee"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/jihoon22-lee/toy-projects"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
memmap2 = "0.9"
memchr = "2.7"
rayon = "1.10"
walkdir = "2.5"
quick-xml = "0.41.0"
clap = { version = "4.5", features = ["derive"] }
object = { version = "0.36", default-features = false, features = ["read_core", "elf"] }
gimli = { version = "0.31", features = ["read", "endian-reader"] }
flate2 = "1.0"
tar = "0.4"
regex = "1.11"
crossterm = "0.29"
ratatui = "0.30"
jiff = "0.2"
cpp_demangle = "0.4"
rustc-demangle = "0.1"
